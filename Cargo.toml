[package]
name = "memogram-rs"
version = "0.1.0"
edition = "2021"
description = "Low-footprint Rust Telegram→Memos (keep memogram defaults + inbox-ping bot commands)"
publish = false

[dependencies]
teloxide = { version = "0.17", features = ["macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
chrono = "0.4"
once_cell = "1.19"