# cargo-deny config for memogram-rs — permissive-only gate.
# Anything copyleft (GPL/AGPL/LGPL) FAILS the check: frankensteined code must
# stay shippable under Juni's MIT projects. Run: cargo deny check licenses
[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unlicense",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "OpenSSL",
  "MPL-2.0",
]
# No `deny` list: anything not in `allow` is rejected, and copyleft=deny
# below double-blocks GPL/AGPL/LGPL families explicitly.
# Anything not in `allow` is rejected, which already blocks all copyleft.
# (cargo-deny 0.20 schema: no copyleft/deny keys under [licenses].)
# Verified 2026-09-19: both exceptions below are permissive, no copyleft in tree.
[[licenses.exceptions]]
allow = ["Apache-2.0 WITH LLVM-exception"]
name = "ar_archive_writer"

[[licenses.exceptions]]
allow = ["CDLA-Permissive-2.0"]
name = "webpki-roots"
# Build/dev deps are in the tree by default, so they count too.

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
